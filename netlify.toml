[build]
  command = "python3 build.py"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/history/*"
  to = "/.netlify/functions/history/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/networks/*"
  to = "/.netlify/functions/explorer/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/networks/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/api/history/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
